<body>
     <header>
        <link rel="stylesheet" href="dashboard.css">
        <nav class="navbar">
            <div class="logo">
              <a style="color: inherit;" href="gunsnroses.html"><img width="100px" src="https://logosmarcas.net/wp-content/uploads/2020/04/Guns-N-Roses-Logo-650x366.png" alt=""></a>

            <div class="tituloNav">
                <p style="color: red;"><a style="color: inherit;" href="gunsnroses.html">Voltar á Home </a></p>
            </div>
            
        </nav>
    </header>

    <div class="KPIs">
        <div class="kpiVotadoGeral"><p><b>Álbum Mais Votado Geral:</b> <br >Appetite for Destruction</p></div>
        <div class="kpiVotadoMasc"><p><b>Álbum Preferido Masculino:</b> <br >Appetite for Destruction</p></div>
        <div class="kpiVotadoFemin"><p><b>Álbum Preferido Feminino :</b> <br >Appetite for Destruction</p></div>
    </div>

    <div class="dashboards">
        <div class="chart-box ">
            <h2>Álbuns Mais Votados (Geral)</h2>
            <canvas id="linhaGeral"></canvas>
        </div>

        <hr>

        <div class="chart-box ">
            <h2>Votação por Sexo</h2>
            <canvas id="barraSexo"></canvas>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>

<script>

const Albuns = [
    'Appetite for Destruction', 
    'G N\' R Lies', 
    'Use Your Illusion I', 
    'Use Your Illusion II', 
    'The Spaghetti Incident?', 
    'Chinese Democracy'
];


const ctxLinha = document.getElementById('linhaGeral').getContext('2d');
new Chart(ctxLinha, {
    type: 'line',
    data: {
        labels: Albuns,
        datasets: [{
            label: 'Popularidade Geral ',
            data: [30, 10, 18, 18, 6, 3], 
            borderColor: '#f1c40f', 
            backgroundColor: 'rgba(241, 196, 15, 0.2)',
            borderWidth: 3,
            fill: true,
            tension: 0.4
        }]
    },
    options: {
        responsive: true,
        plugins: {
            legend: { labels: { color: '#333' } }
        }
    }
});

// VOTAÇÃO POR SEXO
const ctxBarra = document.getElementById('barraSexo').getContext('2d');
new Chart(ctxBarra, {
    type: 'bar',
    data: {
        labels: Albuns,
        datasets: [
            {
                label: 'Público Masculino',
                data: [15, 6, 10, 9, 4, 2],
                backgroundColor: '#003366'
            },
            {
                label: 'Público Feminino',
                data: [15, 4, 8, 9, 2, 1],
                backgroundColor: '#FF007F' 
            }
        ]
    },
    options: {
        responsive: true,
        scales: {
            y: {
                beginAtZero: true,
                title: { display: true, text: 'Votos' }
            }
        }
    }
});

</script>
