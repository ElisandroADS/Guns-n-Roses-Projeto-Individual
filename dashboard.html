<script>

window.onload = 

function carregar()
{
    atualizarKPI()
    mostrarGraficos()
}

//Retorna dados do grafico geral em json objeto
async function getGraficoGeralJson()
{
    try{
        let respostaGeral = await fetch("/dashboard/graficoGeral")
        let dados = await respostaGeral.json()
        return dados
    }
    catch(erro){
        alert("Erro ao buscar dados!")
        console.log(erro) //vai mostrar noconsole o tipo de erro
    }
}

async function getGraficoSexoJson()
{
    try{
        let respostaSexo = await fetch("/dashboard/graficoSexo")
        let dados = await respostaSexo.json()
        return dados
    }
    catch(erro){
        alert("Erro ao buscar dados!")
        console.log(erro)
    }
}

// lista de albuns para usar nos gráficos teste
const Albuns = [
    'Appetite for Destruction', 
    'G N\' R Lies', 
    'Use Your Illusion I', 
    'Use Your Illusion II', 
    'The Spaghetti Incident?', 
    'Chinese Democracy'
];

// mostra os dois graficos
async function mostrarGraficos(){
    let dadosGeral = await getGraficoGeralJson()
    let albunsGraficoGeral = []
    let votos = []
    
    console.log(dadosGeral)
    for(let i = 0; i < dadosGeral.length; i++)
    {
        albunsGraficoGeral.push(dadosGeral[i].nome)
        votos.push(dadosGeral[i].votos)
    

    }

    let dadosSexo =  await getGraficoSexoJson()
    let albuns = []
    let votosMasculinos = []
    let votosFemininos = []
    let votosOutros = []
   
    for(let i = 0; i < dadosSexo.length; i++)
    {

        if(dadosSexo[i].sexo == 'M')
       {
           albuns.push(dadosSexo[i].nome)
           votosMasculinos.push(dadosSexo[i].votos)
       }
           else if(dadosSexo[i].sexo == 'F')
       {
           albuns.push(dadosSexo[i].nome)
           votosFemininos.push(dadosSexo[i].votos)
       }
           else if(dadosSexo[i].sexo == 'Outros')
       {   
           albuns.push(dadosSexo[i].nome)
           votosOutros.push(dadosSexo[i].votos)
       }
    }


    console.log(albunsGraficoGeral, votos)
    console.log( votosMasculinos, votosFemininos, votosOutros )

    const ctxLinha = document.getElementById('linhaGeral').getContext('2d');
    new Chart(ctxLinha, {
        type: 'line',
        data: {
            labels: albunsGraficoGeral,
            datasets: [{
                label: 'Popularidade Geral ',
                data: votos, 
                borderColor: '#f1c40f', 
                backgroundColor: 'rgba(241, 196, 15, 0.2)',
                borderWidth: 3,
                fill: true,
                tension: 0.4
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { labels: { color: '#333' } }
            }
        }
    });
   
    const ctxBarra = document.getElementById('barraSexo').getContext('2d');
    new Chart(ctxBarra, {
    type: 'bar',
    data: {
        labels: albuns,
        datasets: [
            {
                label: 'Público Masculino',
                data: votosMasculinos,
                backgroundColor: '#003366'
            },
            {
                label: 'Público Feminino',
                data: votosFemininos,
                backgroundColor: '#FF007F' 
            },
            {
                label: 'Sexo Outros',
                data: votosOutros,
                backgroundColor: '#898989' 
            }
        ]
    },
    options: {
        responsive: true,
        scales: {
            y: {
                beginAtZero: true,
                title: { display: true, text: 'Votos' }
            }
        }
    }
    });
}


function atualizarKPI()
{
    fetch("http://localhost:8080/kpi/kpiGeral").then(function (resposta) {
             resposta.json().then(json => {
                document.getElementById('kpiVotadoGeral').innerHTML = `<p><b>Álbum Mais Votado Geral:</b> <br >${json[0].nome}</p>`;
                
               })

         
        })
    fetch("http://localhost:8080/kpi/kpiSexoFem").then(function (resposta) {
             resposta.json().then(json => {
                document.getElementById('kpiVotadoMasc').innerHTML = `<p><b>Álbum Preferido Masculino:</b> <br >${json[0].nome}</p>`;
                
               })

         
        })
    fetch("http://localhost:8080/kpi/kpiSexoMasc").then(function (resposta) {
             resposta.json().then(json => {
                document.getElementById('kpiVotadoFemin').innerHTML = `<p><b>Álbum Preferido Feminino :</b> <br >${json[0].nome}</p>`;
                
               })

         
        })
}


</script>
