<script>
function enviarForm()
{
    //let fk_usuario = sessionStorage.getItem("ID_USUARIO", id);
    let fk_album = select_album.value
    let sexo = select_sexo.value
    let email = input_email.value

  
    
    fetch("http://localhost:8080/formulario/enviar", {
         method: "POST",
         headers: {
             "Content-Type": "application/json",
         },
         body: JSON.stringify({
             // crie um atributo que recebe o valor recuperado aqui
             // Agora vá para o arquivo routes/usuario.js
             //fkUsuarioServer: fk_usuario ,
             fkAlbumServer: fk_album,
             sexoServer: sexo,
             emailServer: email
         }),
         })
         .then(function (resposta) {
             console.log("resposta: ", resposta);
 
             if (resposta.ok) {
 
             alert('Formulário enviado com sucesso! Redirecionando para Dashboard...')
             
 
             setTimeout(() => {
                 window.location = "dashboard.html";
             }, 2000);
 
             
             } else {
             throw "Houve um erro ao tentar enviar o formulário!";
             }
         })
         .catch(function (resposta) {
             console.log(`#ERRO: ${resposta}`);
             
         });
 
         return false; 
   

}
</script>
