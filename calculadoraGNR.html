    <div class="calculadora">
    <h3 class="textoCal" style="color: white;">Em que ano conheceu o Guns n' Roses:</h3>
    <input type="text" id="input_ano"><br><br>
    <button onclick="calcular()">Calcular</button>
    </div>
    <div class="resposta" style="color: white;" id="div_mensagem"></div>
    
</body>

</html>

<script>

function calcular(){

    let anoDigitado = Number(input_ano.value)
    let calculoDescoberta = anoDigitado - 1985

    if(anoDigitado < 1985 || anoDigitado > 2026){
        alert("Digite um ano válido entre 1985 e o ano atual")
    }
    else{
        div_mensagem.innerHTML = `Quando Você conheceu a banda já tinha ${calculoDescoberta} anos`
    }


}

</script>
